<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` lets the app paint into the display's cutout areas, which
         is what makes the `env(safe-area-inset-*)` padding in tokens.css and the shell
         meaningful (without it those insets are always 0). `interactive-widget=
         resizes-content` makes the on-screen keyboard shrink the layout viewport rather
         than only the visual one, so the message composer — pinned to the bottom of a
         100dvh shell — stays above the keyboard instead of behind it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>AI Chat</title>
    <script>
      // Resolve the saved theme before the first paint, so a dark-theme user never
      // sees a light flash. Keep in sync with src/theme/themeStore.ts.
      (function () {
        var resolved = 'light'
        try {
          var saved = localStorage.getItem('ai-chat.theme')
          resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (error) {
          // Storage blocked: fall back to the OS setting.
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
